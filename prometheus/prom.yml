global:
  scrape_interval: 15s # Default scrape interval
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'layerr-api'
    scrape_interval: 15s
    metrics_path: "/metrics"
    static_configs:
      - targets: ['API-Gateway.railway.internal:3000']

